[package]
name = "yaoi-example-blueprint-h11spec"
version = "0.0.1"
edition = "2021"
description = "Static state machine / protocol blueprints tls http server example"
homepage = "https://github.com/yaws-rs/yaoi"
keywords = ["io", "uring", "epoll", "async"]
license = "Apache-2.0/MIT"
readme = "README.md"
repository = "https://github.com/yaws-rs/blueprint"
categories = ["science"]

[dependencies]
blueprint = { version = "0.2.0", default-features = false }
blueprints-known = { version = "0.3.0", default-features = false, features = ["ytls-server", "h11server"] }
blueprint-ytls = { version = "0.0.1", default-features = false, features = ["server", "zeroize"] }
blueprint-h11spec = { version = "0.0.5", default-features = false, features = ["h11server"] }
yaws-app-mirror = { version = "0.0.5", default-features = false }
yaws-app-rick-roll = { version = "0.0.5", default-features = false }
ytls-rustcrypto = { version = "0.0.3" }
#blueprint-rustls = { path = "../../../tls/rustls-blueprint", version = "0.0.1", default-features = false, features = ["std", "util"] }
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
pem-rfc7468 = { version = "1", default-features = false, features = ["alloc"] }
sec1 = { version = "0.8", default-features = false }
yaoi = { path = "../../", version = "0.0.1", default-features = false }
hugepage = { version = "0.1.0", default-features = false }

[features]
default = []
std = []

[package.metadata.docs.rs]
features = []
